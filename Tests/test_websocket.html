
<!DOCTYPE html>
<html>
<body>
    <h2>NASA WebSocket Test - Device 1</h2>

    <button onclick="sendMessage()">Join session</button>
    <button onclick="pickCrew('orion')">Choose Orion</button>

    <p id="status">Connecting...</p>
    <p id="result"></p>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");

        ws.onopen = function() {
            document.getElementById("status").innerText = "Connected!";
        };

        ws.onmessage = function(event) {
            document.getElementById("result").innerText = event.data;
        };

        ws.onerror = function() {
            document.getElementById("status").innerText = "Connection error!";
        };

        function sendMessage() {
            ws.send(JSON.stringify({
                event: "device:join",
                code: "TDAJ",
                deviceId: "device1"
            }));
        }

        function pickCrew(crewId) {
            ws.send(JSON.stringify({
                event: "crew:pick",
                crewId: crewId
            }));
        }
    </script>
</body>
</html>
